name: Build Windows Application

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run automated test suite
        run: |
          pytest tests/

      - name: Build standalone executable with PyInstaller
        run: |
          pyinstaller --clean packaging/id_card_generator.spec

      - name: Verify executable creation
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\ExcelIDCardGenerator\ExcelIDCardGenerator.exe")) {
            Write-Error "ExcelIDCardGenerator.exe was not found in dist/ExcelIDCardGenerator!"
            exit 1
          }
          Write-Host "Verified ExcelIDCardGenerator.exe exists successfully." -ForegroundColor Green

      - name: Zip standalone application
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\ExcelIDCardGenerator\*" -DestinationPath "dist\ExcelIDCardGenerator-Windows-x64.zip"

      - name: Compile Inno Setup installer
        uses: Miniong/setup-inno-extract@v1
        continue-on-error: true

      - name: Build Inno Setup Installer (if ISCC available)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) {
            & $iscc packaging\installer.iss
          } else {
            Write-Host "Inno Setup compiler not found on runner path, skipping installer binary."
          }

      - name: Upload Windows Standalone ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExcelIDCardGenerator-Windows-x64
          path: dist/ExcelIDCardGenerator-Windows-x64.zip
          retention-days: 14

      - name: Upload Windows Installer (if built)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ExcelIDCardGenerator-Installer
          path: dist/installer/*.exe
          retention-days: 14
