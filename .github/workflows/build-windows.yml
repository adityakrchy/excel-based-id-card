name: Build Windows Application

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Increment package version
        id: version_bump
        shell: pwsh
        run: |
          python scripts/increment_version.py --github-output

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run automated test suite
        run: |
          pytest tests/

      - name: Build standalone executable with PyInstaller
        run: |
          pyinstaller --clean packaging/id_card_generator.spec

      - name: Verify executable creation
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\ExcelIDCardGenerator\ExcelIDCardGenerator.exe")) {
            Write-Error "ExcelIDCardGenerator.exe was not found in dist/ExcelIDCardGenerator!"
            exit 1
          }
          Write-Host "Verified ExcelIDCardGenerator.exe exists successfully." -ForegroundColor Green

      - name: Zip standalone application
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\ExcelIDCardGenerator\*" -DestinationPath "dist\ExcelIDCardGenerator-Windows-x64.zip"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          winget install --id JRSoftware.InnoSetup --exact `
            --silent --accept-package-agreements --accept-source-agreements

      - name: Build Inno Setup Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

          if (-not (Test-Path $iscc)) {
            $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          }

          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler (ISCC.exe) was not found."
          }

          New-Item -ItemType Directory -Force -Path "dist\installer" | Out-Null

          & $iscc "packaging\installer.iss"

          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup compilation failed with exit code $LASTEXITCODE"
          }

      - name: Commit and push incremented version
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml src/id_card_generator/__init__.py src/id_card_generator/core/constants.py packaging/installer.iss
          $ver = "${{ steps.version_bump.outputs.new_version }}"
          if (-not $ver) {
            $ver = (python -c "from id_card_generator.core.constants import APP_VERSION; print(APP_VERSION)")
          }
          git commit -m "ci: bump package version to $ver [skip ci]"
          try {
            git push origin HEAD:${{ github.ref_name }}
            Write-Host "Successfully committed and pushed incremented version $ver to ${{ github.ref_name }}" -ForegroundColor Green
          } catch {
            Write-Warning "Could not push version commit to remote: $_"
          }

      - name: Upload Windows Standalone ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExcelIDCardGenerator-Windows-x64
          path: dist/ExcelIDCardGenerator-Windows-x64.zip
          retention-days: 14

      - name: Upload Windows Installer (if built)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ExcelIDCardGenerator-Installer
          path: dist/installer/*.exe
          retention-days: 14
