[package]
name = "excel-id-card-rust"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Focused Rust foundation for the Excel ID Card Generator migration"
license = "MIT"
build = "build.rs"

[dependencies]
calamine = "0.26"
csv = "1.3"
crossbeam-channel = "0.5"
eframe = "0.29"
rfd = "0.15"
ab_glyph = "0.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
imageproc = "0.25"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2.5"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[lib]
name = "excel_id_card_rust"
path = "src/lib.rs"

[[bin]]
name = "excel-id-card-rust"
path = "src/main.rs"
